name: Server release and IPv4 admission
on:
  push:
    branches: ['codex/**', main]
    paths: ['deploy/**', 'agents/**', 'tests/test_server_deploy.py', 'tests/test_ipv4_input.py', 'model/ipv4-input*.json', 'flows/ipv4-input.json', 'scenarios/ipv4-input/**', 'docs/ipv4-input-slice.md', '.github/workflows/server-release.yml']
  pull_request:
    paths: ['deploy/**', 'agents/**', 'tests/test_server_deploy.py', 'tests/test_ipv4_input.py', 'model/ipv4-input*.json', 'flows/ipv4-input.json', 'scenarios/ipv4-input/**', 'docs/ipv4-input-slice.md', '.github/workflows/server-release.yml']
permissions:
  contents: read
jobs:
  offline-release-and-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated dependency
        run: |
          python3 -m venv /tmp/deploy-tests-venv
          /tmp/deploy-tests-venv/bin/python -m pip install -r requirements-formal.txt
      - name: Test package isolation and offline gateway budget faults
        run: /tmp/deploy-tests-venv/bin/python -m unittest discover -s tests -p test_server_deploy.py -v
      - name: Test reviewed IPv4 candidate and independent contracts
        run: /tmp/deploy-tests-venv/bin/python -m unittest discover -s tests -p test_ipv4_input.py -v
      - name: Test unattended model job isolation without API calls
        run: /tmp/deploy-tests-venv/bin/python -m unittest discover -s tests -p test_model_job.py -v
