name: Composed IR TCP first-ingress Linux diagnostic
on:
  push:
    branches: ['codex/**', main]
    paths: ['ports/linux-tcp-ipv4-peer/**', 'ports/tcp_ipv4_probe_support.py', 'ports/native_session.py', 'protocol_lab/**', 'model/tcp-ipv4*.json', 'tests/test_linux_tcp_ipv4_probe.py', 'tests/test_tcp_ipv4_probe_lifecycle.py', 'tests/test_tcp_ipv4_capture_contract.py', '.github/workflows/linux-tcp-ipv4-probe.yml']
  pull_request:
    paths: ['ports/linux-tcp-ipv4-peer/**', 'ports/tcp_ipv4_probe_support.py', 'ports/native_session.py', 'protocol_lab/**', 'model/tcp-ipv4*.json', 'tests/test_linux_tcp_ipv4_probe.py', 'tests/test_tcp_ipv4_probe_lifecycle.py', 'tests/test_tcp_ipv4_capture_contract.py', '.github/workflows/linux-tcp-ipv4-probe.yml']
permissions:
  contents: read
jobs:
  first-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump python3-venv gcc
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/tcp-ipv4-first-ingress
      - name: Check diagnostic failure and lifecycle contracts
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_linux_tcp_ipv4_probe.py -v > artifacts/tcp-ipv4-first-ingress/helper-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_tcp_ipv4_probe_lifecycle.py -v > artifacts/tcp-ipv4-first-ingress/lifecycle-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_tcp_ipv4_capture_contract.py -v > artifacts/tcp-ipv4-first-ingress/capture-contract-tests.log 2>&1
      - name: Generate and compile the unchanged authoritative IR
        run: |
          .venv/bin/python -m protocol_lab.codegen model/tcp-ipv4-endpoint.json --out artifacts/tcp-ipv4-first-ingress/generation > artifacts/tcp-ipv4-first-ingress/generation-result.json
          .venv/bin/python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from protocol_lab.codegen.execute import build
          out=Path('artifacts/tcp-ipv4-first-ingress')
          r=build(out/'generation',out/'build')
          (out/'build-result.json').write_text(json.dumps(r,indent=2)+'\n')
          assert r['status']=='pass'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          paths=['model/tcp-ipv4-endpoint.json','ports/linux-tcp-ipv4-peer/probe.py','ports/tcp_ipv4_probe_support.py','ports/native_session.py','ports/linux-tcp-wire-peer/server.py']
          source={p:hashlib.sha256(Path(p).read_bytes()).hexdigest()for p in paths}
          (out/'provenance.json').write_text(json.dumps(dict(source_commit=git('rev-parse','HEAD'),source_tree=git('rev-parse','HEAD^{tree}'),sources=source,claim='first TCP ingress diagnostic only; no full exchange or whole endpoint claim'),indent=2)+'\n')
          PY
      - name: Observe original Ethernet frames in a new network namespace
        run: |
          parent_netns="$(readlink /proc/self/ns/net)"
          sudo unshare --net .venv/bin/python ports/linux-tcp-ipv4-peer/probe.py --out artifacts/tcp-ipv4-first-ingress/live --model model/tcp-ipv4-endpoint.json --executable artifacts/tcp-ipv4-first-ingress/build/protocol-native --parent-netns "$parent_netns"
      - name: Retain original packets capture source compile and rejection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composed-tcp-first-ingress-${{ github.sha }}
          path: artifacts/tcp-ipv4-first-ingress/
          if-no-files-found: error
