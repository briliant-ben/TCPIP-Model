name: Exact query proof regression
on:
  push:
    branches: ['codex/**', main]
    paths: ['formal/**', 'protocol_lab/**', 'model/**', 'tests/**', 'tools/run_query_verification_tests.py', 'tools/run_frozen_regression.py', 'requirements-formal.txt', '.github/workflows/query-verification.yml']
  pull_request:
    paths: ['formal/**', 'protocol_lab/**', 'model/**', 'tests/**', 'tools/run_query_verification_tests.py', 'tools/run_frozen_regression.py', 'requirements-formal.txt', '.github/workflows/query-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-certificate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build isolated Python runtime with pinned Z3
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
      - name: Test source contexts proof DAGs transformations and rejection controls
        run: |
          set -o pipefail
          mkdir -p artifacts/query-verification-ci
          .venv/bin/python tools/run_query_verification_tests.py --out artifacts/query-verification-ci/report 2>&1 | tee artifacts/query-verification-ci/unittest.log
      - name: Preserve input versions selected test IDs terminal result and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: query-verification-${{ github.sha }}
          path: artifacts/query-verification-ci/
          if-no-files-found: error
