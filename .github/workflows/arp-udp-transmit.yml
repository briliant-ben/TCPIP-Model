name: Single IR ARP IPv4 UDP transmit composition
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'model/arp-udp-transmit*.json', 'model/arp-endpoint.json', 'model/udp-wire-transmit.json', 'flows/arp-udp-transmit.json', 'scenarios/arp-udp-transmit/**', 'scenarios/arp-endpoint/**', 'examples/ethernet_udp_observe.py', 'spec/arp-udp-transmit-oracle.json', 'spec/fixtures/arp_udp_transmit_v1.py', 'spec/sources/rfc894*', 'tests/test_arp_udp_transmit.py', 'tests/test_sequence_induction.py', 'docs/sequence-invariant-induction.md', 'docs/arp-udp-transmit.md', '.github/workflows/arp-udp-transmit.yml']
  pull_request:
    paths: ['protocol_lab/**', 'model/arp-udp-transmit*.json', 'model/arp-endpoint.json', 'model/udp-wire-transmit.json', 'flows/arp-udp-transmit.json', 'scenarios/arp-udp-transmit/**', 'scenarios/arp-endpoint/**', 'examples/ethernet_udp_observe.py', 'spec/arp-udp-transmit-oracle.json', 'spec/fixtures/arp_udp_transmit_v1.py', 'spec/sources/rfc894*', 'tests/test_arp_udp_transmit.py', 'tests/test_sequence_induction.py', 'docs/sequence-invariant-induction.md', 'docs/arp-udp-transmit.md', '.github/workflows/arp-udp-transmit.yml']
permissions:
  contents: read
jobs:
  native-and-literal-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare fixed tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/arp-udp-native
      - name: Check combined queue wire and unchanged component contracts
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_arp_udp_transmit.py -v > artifacts/arp-udp-native/composed-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_sequence_induction.py -v > artifacts/arp-udp-native/induction-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_arp_endpoint.py -v > artifacts/arp-udp-native/arp-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_udp_transmit.py -v > artifacts/arp-udp-native/udp-tests.log 2>&1
      - name: Retain actual C and independent exact fixed-input Z3 for both scenario sets
        run: |
          .venv/bin/python examples/run_native_suite.py model/arp-udp-transmit.json --scenario-dir scenarios/arp-udp-transmit --formal-replay --out artifacts/arp-udp-native/composed > artifacts/arp-udp-native/composed-result.json
          .venv/bin/python examples/run_native_suite.py model/arp-udp-transmit.json --scenario-dir scenarios/arp-endpoint --formal-replay --out artifacts/arp-udp-native/legacy-arp > artifacts/arp-udp-native/legacy-arp-result.json
      - name: Retain complete raw native fixed Z3 and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arp-udp-native-${{ github.sha }}
          path: artifacts/arp-udp-native/
          if-no-files-found: error
  ten-stage-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare fixed tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/arp-udp-flow
      - name: Run and verify the source-bound single IR task
        run: |
          COMPOSE_TASK_SHA=$(sha256sum flows/arp-udp-transmit.json | cut -d ' ' -f 1)
          .venv/bin/python examples/run_spec_candidate.py --workspace . --task flows/arp-udp-transmit.json --task-sha256 "$COMPOSE_TASK_SHA" --out artifacts/arp-udp-flow/run > artifacts/arp-udp-flow/result.json
      - name: Retain all stages and unresolved or failed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arp-udp-flow-${{ github.sha }}
          path: artifacts/arp-udp-flow/
          if-no-files-found: error
