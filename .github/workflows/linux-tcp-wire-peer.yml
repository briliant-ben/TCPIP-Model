name: IR generated TCP with independent Linux peer
on:
  push:
    branches: ['codex/**', main]
    paths: ['ports/linux-tcp-wire-peer/**', 'ports/native_session.py', 'protocol_lab/**', 'model/tcp*.json', 'spec/tcp-wire-endpoint-oracle.json', 'tests/test_tcp_peer_symbolic_gate.py', 'tests/test_tcp_wire_harness_preflight.py', '.github/workflows/linux-tcp-wire-peer.yml', 'requirements-formal.txt']
  pull_request:
    paths: ['ports/linux-tcp-wire-peer/**', 'ports/native_session.py', 'protocol_lab/**', 'model/tcp*.json', 'spec/tcp-wire-endpoint-oracle.json', 'tests/test_tcp_peer_symbolic_gate.py', 'tests/test_tcp_wire_harness_preflight.py', '.github/workflows/linux-tcp-wire-peer.yml', 'requirements-formal.txt']
permissions:
  contents: read
jobs:
  kernel-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts
      - name: Check runtime and evidence faults
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_tcp_peer_symbolic_gate.py -v > artifacts/tcp-runtime-gate-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_tcp_wire_harness_preflight.py -v > artifacts/tcp-runtime-preflight-tests.log 2>&1
      - name: Execute generated subject in isolated namespace
        run: sudo .venv/bin/python ports/linux-tcp-wire-peer/run.py --out artifacts/linux-tcp-wire-peer
      - name: Reconstruct original runtime evidence without rerunning the solver
        run: sudo .venv/bin/python ports/linux-tcp-wire-peer/run.py --verify --out artifacts/linux-tcp-wire-peer
      - name: Retain original source provenance raw packets and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-ir-tcp-wire-peer-${{ github.sha }}
          path: |
            artifacts/linux-tcp-wire-peer/
            artifacts/tcp-runtime-*-tests.log
          if-no-files-found: error
