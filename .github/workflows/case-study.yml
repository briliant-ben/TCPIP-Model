name: Minimal TCPIP case study
on:
  push:
    branches: [main, 'codex/**', 'gemini/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile standalone C, compare frozen fixture, and rebuild recorded demo
        run: python3 -m unittest discover -s tests -v > case-tests.log 2>&1
      - name: Run live communicating prototype over UDP loopback and capture PCAP
        run: |
          set -o pipefail
          python3 demo/live_demo.py --mode all --transport udp --out /tmp/tcpip-ci-live 2>&1 | tee -a case-tests.log
          if command -v tcpdump >/dev/null 2>&1; then
            tcpdump -nn -r /tmp/tcpip-ci-live/live-capture.pcap 2>&1 | tee -a case-tests.log
          fi
      - name: Preserve actual result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimal-case-${{ github.sha }}
          path: |
            case-tests.log
            /tmp/tcpip-ci-live/live-capture.pcap
            /tmp/tcpip-ci-live/summary.json
            /tmp/tcpip-ci-live/frames.txt
          if-no-files-found: error
  lean-and-regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Clone pinned Formal-Spec-Agent framework
        run: |
          FW_COMMIT=$(python3 -c "import json; f=json.load(open('formal/framework.json'))['commit']; c=json.load(open('code/framework.json'))['commit']; assert f==c, (f, c); print(f)")
          git clone https://github.com/briliant-ben/Formal-Spec-Agent.git /tmp/Formal-Spec-Agent
          git -C /tmp/Formal-Spec-Agent checkout --detach "$FW_COMMIT"
      - name: Verify C regeneration against pinned framework
        run: |
          python3 code/regenerate.py --framework /tmp/Formal-Spec-Agent \
            --python "$(command -v python3)" --out /tmp/tcpip-ci-regen
      - name: Install checksum-pinned official Lean
        run: |
          curl --fail --location --connect-timeout 20 --max-time 300 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            --output /tmp/lean.tar.zst
          echo '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  /tmp/lean.tar.zst' | sha256sum --check
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          /tmp/lean-4.35.0-linux/bin/lean --version
      - name: Run formal Lean check and verify against committed evidence
        run: |
          make formal PYTHON=python3 FRAMEWORK=/tmp/Formal-Spec-Agent \
            LEAN=/tmp/lean-4.35.0-linux/bin/lean OUT=/tmp/tcpip-ci-formal > formal-check.log 2>&1
          PYTHONPATH=/tmp/Formal-Spec-Agent python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          from formal_spec_agent import lean_timed_check

          out = Path('/tmp/tcpip-ci-formal')
          model = Path('model/ipv4-endpoint-virtual-link.json')
          manifest = Path('formal/lean/manifest.json')
          msha = hashlib.sha256(manifest.read_bytes()).hexdigest()
          inspected = lean_timed_check.inspect(out, model, manifest, msha)
          assert inspected['schema'] == 'fsa-lean-timed-check-result-v2'
          assert inspected['status'] == 'checked_timed_dispatch_contract'

          res = json.loads((out / 'result.json').read_text())
          receipt = json.loads(Path('formal/lean-result.json').read_text())
          assert res['schema'] == 'fsa-lean-timed-check-result-v2'
          assert res['status'] == 'checked_timed_dispatch_contract'
          assert res['raw_firings'] == 335
          assert res['conflict_groups'] == 18
          assert len(res['commands']) == 119
          assert all(c['returncode'] == 0 for c in res['commands'])
          assert res['axioms'] == receipt['axioms']
          assert res['model'] == receipt['model']
          assert res['proof_manifest_sha256'] == receipt['proof_manifest_sha256']

          with tarfile.open('formal/proof-evidence.tar.gz', 'r:gz') as tf:
              committed_res = json.loads(tf.extractfile('result.json').read())
          assert len(committed_res['sources']) == 119
          assert res['sources'] == committed_res['sources']
          PY
      - name: Upload formal verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-formal-check-${{ github.sha }}
          path: |
            formal-check.log
            /tmp/tcpip-ci-formal/result.json
          if-no-files-found: warn
  tcpip-lib-c99:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build static libraries and enforce core L2-L4 size target (<= 90 KiB .text)
        run: |
          set -o pipefail
          make lib size 2>&1 | tee build-lib.log
      - name: Run M1-M4 stack suites (NO_SYS=1 and NO_SYS=0)
        run: |
          set -o pipefail
          make test-lib 2>&1 | tee -a build-lib.log
      - name: Run ASan + UBSan suite
        run: |
          set -o pipefail
          make test-asan 2>&1 | tee -a build-lib.log
      - name: Run ThreadSanitizer suite
        run: |
          set -o pipefail
          setarch $(uname -m) -R make test-tsan 2>&1 | tee -a build-lib.log
      - name: Run BSD socket & DHCP/DNS demos, benchmarks, and PCAP checks
        run: |
          set -o pipefail
          make demos bench 2>&1 | tee -a build-lib.log
          if command -v tcpdump >/dev/null 2>&1; then
            tcpdump -c 20 -nn -r build/m3_tcp_udp.pcap 2>&1 | tee -a build-lib.log
            tcpdump -nn -r build/tcp_echo_demo.pcap 2>&1 | tee -a build-lib.log
            tcpdump -nn -r build/dhcp_dns_demo.pcap 2>&1 | tee -a build-lib.log
          fi
      - name: Verify FreeRTOS port skeleton compilation
        run: |
          mkdir -p /tmp/frtos-stub
          cat > /tmp/frtos-stub/FreeRTOS.h <<'EOF'
          #ifndef FREERTOS_H
          #define FREERTOS_H
          #include <stdint.h>
          typedef uint32_t TickType_t;
          typedef uint32_t UBaseType_t;
          typedef uint32_t StackType_t;
          typedef long BaseType_t;
          typedef void *TaskHandle_t;
          typedef void *SemaphoreHandle_t;
          typedef void *QueueHandle_t;
          typedef void (*TaskFunction_t)(void *);
          #define pdTRUE ((BaseType_t)1)
          #define pdFALSE ((BaseType_t)0)
          #define pdPASS pdTRUE
          #define portMAX_DELAY ((TickType_t)0xFFFFFFFFUL)
          #define portTICK_PERIOD_MS ((TickType_t)1U)
          #define pdMS_TO_TICKS(ms) ((TickType_t)(ms))
          #endif
          EOF
          cat > /tmp/frtos-stub/task.h <<'EOF'
          #ifndef TASK_H
          #define TASK_H
          #include "FreeRTOS.h"
          TickType_t xTaskGetTickCount(void);
          void vTaskDelay(TickType_t ticks);
          BaseType_t xTaskCreate(TaskFunction_t fn, const char *name, uint16_t stk, void *arg, UBaseType_t prio, TaskHandle_t *h);
          void vTaskDelete(TaskHandle_t h);
          #endif
          EOF
          cat > /tmp/frtos-stub/semphr.h <<'EOF'
          #ifndef SEMPHR_H
          #define SEMPHR_H
          #include "FreeRTOS.h"
          SemaphoreHandle_t xSemaphoreCreateCounting(UBaseType_t max_cnt, UBaseType_t init_cnt);
          BaseType_t xSemaphoreTake(SemaphoreHandle_t s, TickType_t ticks);
          BaseType_t xSemaphoreGive(SemaphoreHandle_t s);
          void vSemaphoreDelete(SemaphoreHandle_t s);
          #endif
          EOF
          cat > /tmp/frtos-stub/queue.h <<'EOF'
          #ifndef QUEUE_H
          #define QUEUE_H
          #include "FreeRTOS.h"
          QueueHandle_t xQueueCreate(UBaseType_t len, UBaseType_t item_sz);
          BaseType_t xQueueSend(QueueHandle_t q, const void *item, TickType_t ticks);
          BaseType_t xQueueReceive(QueueHandle_t q, void *item, TickType_t ticks);
          void vQueueDelete(QueueHandle_t q);
          #endif
          EOF
          cc -std=c99 -Wall -Wextra -Werror -Os -DTCPIP_NO_SYS=0 -DTCPIP_PORT_FREERTOS=1 -DTCPIP_VERIFY_FSM=0 -I include -I /tmp/frtos-stub -c port/freertos/sys_port_freertos.c -o build/sys_port_freertos.o
          cc -std=c99 -Wall -Wextra -Werror -Os -DTCPIP_NO_SYS=0 -DTCPIP_PORT_FREERTOS=1 -DTCPIP_VERIFY_FSM=1 -I include -I src/generated -I /tmp/frtos-stub -c port/freertos/sys_port_freertos.c -o build/sys_port_freertos_fsm.o
      - name: Publish libtcpip build & test summary
        if: always()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 build-lib.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build-lib.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-lib.log ] && [ "${{ job.status }}" = "failure" ]; then
            python3 -c "import pathlib; lines=pathlib.Path('build-lib.log').read_text(errors='replace').splitlines()[-45:]; print('::error::' + '%0A'.join(lines))"
          fi
      - name: Upload libtcpip build & PCAP artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libtcpip-c99-${{ github.sha }}
          path: |
            build-lib.log
            build/m2_l2l3.pcap
            build/m3_tcp_udp.pcap
            build/tcp_echo_demo.pcap
            build/dhcp_dns_demo.pcap
          if-no-files-found: warn
  tcpip-lib-formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Clone pinned Formal-Spec-Agent framework for libtcpip
        run: |
          FW_COMMIT=$(python3 -c "import json; print(json.load(open('formal/lib/framework.json'))['commit'])")
          git clone https://github.com/briliant-ben/Formal-Spec-Agent.git /tmp/Formal-Spec-Agent
          git -C /tmp/Formal-Spec-Agent checkout --detach "$FW_COMMIT"
      - name: Verify C99 FSM library regeneration matches committed sources
        run: make regen-lib FRAMEWORK=/tmp/Formal-Spec-Agent
      - name: Install checksum-pinned official Lean
        run: |
          curl --fail --location --connect-timeout 20 --max-time 300 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            --output /tmp/lean.tar.zst
          echo '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  /tmp/lean.tar.zst' | sha256sum --check
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          /tmp/lean-4.35.0-linux/bin/lean --version
      - name: Verify all 8 Lean 4.35.0 timed FSM proofs
        run: |
          set -o pipefail
          make formal-lib FRAMEWORK=/tmp/Formal-Spec-Agent \
            LEAN=/tmp/lean-4.35.0-linux/bin/lean 2>&1 | tee formal-lib.log
      - name: Upload formal library check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libtcpip-formal-${{ github.sha }}
          path: formal-lib.log
          if-no-files-found: warn
