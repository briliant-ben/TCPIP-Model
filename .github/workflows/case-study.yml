name: Minimal TCPIP case study
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile standalone C, compare frozen fixture, and rebuild recorded demo
        run: python3 -m unittest discover -s tests -v > case-tests.log 2>&1
      - name: Preserve actual result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimal-case-${{ github.sha }}
          path: case-tests.log
          if-no-files-found: error
