name: Generated IR UDP with independent Linux peer
on:
  push:
    branches: ['codex/**', main]
    paths: ['ports/linux-udp-peer/**', '.github/workflows/linux-udp-peer.yml', 'protocol_lab/**', 'model/udp-wire-*.json', 'model/udp-atomic-*.json', 'scenarios/udp-atomic-receive/**', 'flows/udp-atomic-receive.json', 'docs/udp-atomic-receive.md', 'spec/udp-atomic-receive-oracle.json', 'spec/fixtures/udp_atomic_receive_v1.py', 'tests/test_udp_atomic.py', 'flows/udp-wire-*.json', 'scenarios/udp-wire-transmit/**', 'requirements-formal.txt']
  pull_request:
    paths: ['ports/linux-udp-peer/**', '.github/workflows/linux-udp-peer.yml', 'protocol_lab/**', 'model/udp-wire-*.json', 'model/udp-atomic-*.json', 'scenarios/udp-atomic-receive/**', 'flows/udp-atomic-receive.json', 'docs/udp-atomic-receive.md', 'spec/udp-atomic-receive-oracle.json', 'spec/fixtures/udp_atomic_receive_v1.py', 'tests/test_udp_atomic.py', 'flows/udp-wire-*.json', 'scenarios/udp-wire-transmit/**', 'requirements-formal.txt']
permissions:
  contents: read
jobs:
  kernel-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump ethtool python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts
      - name: Check adapter faults and strict capture decoding
        run: .venv/bin/python ports/linux-udp-peer/tests.py > artifacts/linux-udp-peer-tests.log 2>&1
      - name: Verify explicit atomic ID extension before using it against the peer
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_udp_atomic.py -v > artifacts/linux-udp-atomic-tests.log 2>&1
          ATOMIC_TASK_SHA=$(sha256sum flows/udp-atomic-receive.json | cut -d ' ' -f 1)
          .venv/bin/python examples/run_spec_candidate.py --workspace . --task flows/udp-atomic-receive.json --task-sha256 "$ATOMIC_TASK_SHA" --out artifacts/linux-udp-atomic-flow > artifacts/linux-udp-atomic-flow-result.json
          .venv/bin/python examples/run_native_suite.py model/udp-wire-receive-atomic.json --scenario-dir scenarios/udp-atomic-receive --formal-replay --out artifacts/linux-udp-atomic-fixed > artifacts/linux-udp-atomic-fixed-result.json
      - name: Generate native models and execute peer in a distinct namespace
        run: sudo .venv/bin/python ports/linux-udp-peer/run.py --out artifacts/linux-udp-peer
      - name: Independently reconstruct and recheck original runtime evidence
        run: sudo .venv/bin/python ports/linux-udp-peer/verify.py --out artifacts/linux-udp-peer
      - name: Retain original generated C ELF actual TUN packets capture and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-ir-udp-peer-${{ github.sha }}
          path: |
            artifacts/linux-udp-peer/
            artifacts/linux-udp-peer-tests.log
            artifacts/linux-udp-atomic-*
          if-no-files-found: error
