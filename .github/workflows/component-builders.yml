name: DeepSeek component builder contracts
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/compose/**', 'agents/**', 'tests/test_namespace*.py', 'tests/test_disjoint_union.py', 'tests/test_component_state_lowering.py', 'tests/test_server_handoff.py', '.github/workflows/component-builders.yml']
  pull_request:
    paths: ['protocol_lab/compose/**', 'agents/**', 'tests/test_namespace*.py', 'tests/test_disjoint_union.py', 'tests/test_component_state_lowering.py', 'tests/test_server_handoff.py', '.github/workflows/component-builders.yml']
permissions:
  contents: read
jobs:
  namespace-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
      - name: Test independent literals timer projection native C and source rejection
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_namespace*.py' -v
          .venv/bin/python -m unittest discover -s tests -p test_server_handoff.py -v
          .venv/bin/python -m unittest discover -s tests -p test_component_state_lowering.py -v
          .venv/bin/python -m unittest discover -s tests -p test_disjoint_union.py -v
