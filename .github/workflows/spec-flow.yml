name: Repeatable spec flow
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'flows/**', 'tests/test_pipeline.py', 'model/tcp.json', 'model/exploration.json', 'scenarios/*.json', 'spec/sources/**', 'docs/semantics.md', 'requirements-formal.txt', '.github/workflows/spec-flow.yml']
  pull_request:
    paths: ['protocol_lab/**', 'flows/**', 'tests/test_pipeline.py', 'model/tcp.json', 'model/exploration.json', 'scenarios/*.json', 'spec/sources/**', 'docs/semantics.md', 'requirements-formal.txt', '.github/workflows/spec-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated formal dependency
        run: |
          python3 -m venv /tmp/spec-flow-venv
          /tmp/spec-flow-venv/bin/python -m pip install -r requirements-formal.txt
      - name: Check isolation classification and evidence gates
        run: |
          mkdir -p artifacts/spec-flow-ci
          /tmp/spec-flow-venv/bin/python -m unittest discover -s tests -p test_pipeline.py -v > artifacts/spec-flow-ci/tests.log 2>&1
      - name: Run the actual complete event-level task
        run: |
          FLOW_TASK_SHA=$(sha256sum flows/tcp-active-open.json | cut -d ' ' -f 1)
          /tmp/spec-flow-venv/bin/python -m protocol_lab.pipeline run flows/tcp-active-open.json --workspace . --task-sha256 "$FLOW_TASK_SHA" --out artifacts/spec-flow-ci/run > artifacts/spec-flow-ci/run.jsonl
      - name: Verify immutable task and stage evidence
        run: |
          FLOW_TASK_SHA=$(sha256sum flows/tcp-active-open.json | cut -d ' ' -f 1)
          /tmp/spec-flow-venv/bin/python -m protocol_lab.pipeline verify artifacts/spec-flow-ci/run --workspace . --task-sha256 "$FLOW_TASK_SHA" > artifacts/spec-flow-ci/verification.json
      - name: Preserve formal tests native observations and source bindings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spec-flow-${{ github.sha }}
          path: artifacts/spec-flow-ci/
          if-no-files-found: error
