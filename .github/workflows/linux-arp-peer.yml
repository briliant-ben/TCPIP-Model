name: Generated IR ARP with independent Linux peer
on:
  push:
    branches: ['codex/**', main]
    paths: ['ports/linux-arp-peer/**', 'ports/native_session.py', '.github/workflows/linux-arp-peer.yml', 'protocol_lab/**', 'model/arp-endpoint.json', 'flows/arp-endpoint.json', 'examples/arp_observe.py', 'tests/test_arp_endpoint.py', 'requirements-formal.txt']
  pull_request:
    paths: ['ports/linux-arp-peer/**', 'ports/native_session.py', '.github/workflows/linux-arp-peer.yml', 'protocol_lab/**', 'model/arp-endpoint.json', 'flows/arp-endpoint.json', 'examples/arp_observe.py', 'tests/test_arp_endpoint.py', 'requirements-formal.txt']
permissions:
  contents: read
jobs:
  kernel-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts
      - name: Check live session faults and existing ARP contracts
        run: |
          .venv/bin/python ports/linux-arp-peer/tests.py > artifacts/linux-arp-peer-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_arp_endpoint.py -v > artifacts/linux-arp-contract-tests.log 2>&1
      - name: Run continuous generated C against kernel ARP in separate namespaces
        run: sudo .venv/bin/python ports/linux-arp-peer/run.py --out artifacts/linux-arp-peer
      - name: Reconstruct and verify original runtime evidence
        run: sudo .venv/bin/python ports/linux-arp-peer/verify.py --out artifacts/linux-arp-peer
      - name: Retain raw source-bound sessions PCAP and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-ir-arp-peer-${{ github.sha }}
          path: |
            artifacts/linux-arp-peer/
            artifacts/linux-arp-peer-tests.log
            artifacts/linux-arp-contract-tests.log
          if-no-files-found: error
