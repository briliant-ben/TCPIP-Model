name: Rocq IR primitive pilot
on:
  push:
    branches: ['codex/**', main]
    paths: ['formal/rocq/**', 'docs/semantics.md', 'protocol_lab/ir.py', 'protocol_lab/symbolic.py', '.github/workflows/rocq.yml']
  pull_request:
    paths: ['formal/rocq/**', 'docs/semantics.md', 'protocol_lab/ir.py', 'protocol_lab/symbolic.py', '.github/workflows/rocq.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pull exact Rocq 9.2.0 image
        run: docker pull rocq/rocq-prover:9.2.0@sha256:33926fb3757b2b560c3844157bd64173a26b6d338a256be1ae5eec8df2019025
      - name: Compile, audit assumptions and independently recheck proof objects
        run: python3 formal/rocq/check.py --docker
      - name: Preserve checker logs and proof objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rocq-ir-primitives-${{ github.sha }}
          path: artifacts/rocq/
          if-no-files-found: error
