name: Pinned external framework client
on:
  push:
    branches: [main, 'codex/**']
    paths: ['framework', 'framework.lock.json', '.gitmodules', 'tools/run_framework_candidate.py', 'tests/test_framework_client.py', 'docs/frozen-legacy-framework.json', '.github/workflows/framework-client.yml']
  pull_request:
    paths: ['framework', 'framework.lock.json', '.gitmodules', 'tools/run_framework_candidate.py', 'tests/test_framework_client.py', 'docs/frozen-legacy-framework.json', '.github/workflows/framework-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare independent environment
        run: |
          python3 -m venv /tmp/framework-client-venv
          /tmp/framework-client-venv/bin/python -m pip install -r requirements-formal.txt
      - name: Run real external C and task/verify, reject changed pins, preserve legacy hashes
        run: /tmp/framework-client-venv/bin/python -m unittest discover -s tests -p test_framework_client.py -v > framework-client-tests.log 2>&1
      - name: Preserve real result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framework-client-${{ github.sha }}
          path: framework-client-tests.log
          if-no-files-found: error
