name: Finite IPv4 ACK certificate audit
on:
  push:
    branches: ['codex/**', main]
    paths: ['tools/verify_ipv4_ack_certificates.py', 'artifacts/ipv4-directed-coverage-20261110/ack-*', 'artifacts/ipv4-directed-coverage-20261110/formal-originals.tar.gz', 'protocol_lab/ir.py', 'protocol_lab/symbolic.py', 'model/ipv4-endpoint-virtual-link.json', 'requirements-formal.txt', '.github/workflows/ipv4-ack-certificates.yml']
  pull_request:
    paths: ['tools/verify_ipv4_ack_certificates.py', 'artifacts/ipv4-directed-coverage-20261110/ack-*', 'artifacts/ipv4-directed-coverage-20261110/formal-originals.tar.gz', 'protocol_lab/ir.py', 'protocol_lab/symbolic.py', 'model/ipv4-endpoint-virtual-link.json', 'requirements-formal.txt', '.github/workflows/ipv4-ack-certificates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-bodies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare dependency
        run: |
          python3 -m venv /tmp/ack-audit-venv
          /tmp/ack-audit-venv/bin/python -m pip install -r requirements-formal.txt
      - name: Verify exact bodies without executing archived code or solver
        run: /tmp/ack-audit-venv/bin/python tools/verify_ipv4_ack_certificates.py
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-ack-audit-${{ github.sha }}
          path: artifacts/ipv4-directed-coverage-20261110/ack-certificate-readonly-audit.json
          if-no-files-found: error
