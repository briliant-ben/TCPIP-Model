name: IR word32 packing across reference Z3 and C
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'model/word32-contract*.json', 'scenarios/word32-contract/**', 'flows/word32-contract.json', 'tests/test_word32_packing.py', 'docs/word32-packing.md', '.github/workflows/word32-packing.yml']
  pull_request:
    paths: ['protocol_lab/**', 'model/word32-contract*.json', 'scenarios/word32-contract/**', 'flows/word32-contract.json', 'tests/test_word32_packing.py', 'docs/word32-packing.md', '.github/workflows/word32-packing.yml']
permissions:
  contents: read
jobs:
  arithmetic-native-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/word32-ci
      - name: Check complete octets signed endpoints symbolic contracts and native faults
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_word32_packing.py -v > artifacts/word32-ci/tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_wire_arithmetic.py -v > artifacts/word32-ci/wire-regression.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_byte_access.py -v > artifacts/word32-ci/read-regression.log 2>&1
      - name: Run and verify ordinary bounded arithmetic task
        run: |
          TASK_SHA=$(sha256sum flows/word32-contract.json | cut -d ' ' -f 1)
          .venv/bin/python examples/run_spec_candidate.py --workspace . --task flows/word32-contract.json --task-sha256 "$TASK_SHA" --out artifacts/word32-ci/run > artifacts/word32-ci/result.json
          .venv/bin/python examples/run_native_suite.py model/word32-contract.json --scenario-dir scenarios/word32-contract --formal-replay --out artifacts/word32-ci/native > artifacts/word32-ci/native-result.json
      - name: Retain raw source bound C SMT outputs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: word32-packing-${{ github.sha }}
          path: artifacts/word32-ci/
          if-no-files-found: error
