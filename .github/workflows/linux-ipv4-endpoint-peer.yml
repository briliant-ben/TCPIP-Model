name: Single generated IPv4 UDP ICMP endpoint with independent Linux peer
on:
  push:
    branches: ['codex/**', main]
    paths: ['ports/linux-ipv4-endpoint-peer/**', 'ports/native_session.py', '.github/workflows/linux-ipv4-endpoint-peer.yml', 'protocol_lab/**', 'model/arp-endpoint.json', 'model/arp-udp-transmit.json', 'model/ipv4-udp-icmp-endpoint.json', 'model/ipv4-udp-icmp-tap.json', 'spec/ipv4-udp-icmp-tap-oracle.json', 'spec/fixtures/ipv4_udp_icmp_tap_v1.py', 'spec/sources/**', 'docs/ipv4-udp-icmp-tap.md', 'scenarios/ipv4-udp-icmp-tap/**', 'tests/test_ipv4_udp_icmp_tap.py', 'flows/arp-udp-transmit.json', 'examples/arp_observe.py', 'examples/ethernet_udp_observe.py', 'examples/icmp_observe.py', 'protocol_lab/udp_observe.py', 'tests/test_arp_udp_transmit.py', 'requirements-formal.txt', 'tests/test_linux_ipv4_endpoint_peer.py', 'tests/test_icmp_echo_inductive.py', 'flows/icmp-echo-inductive.json']
  pull_request:
    paths: ['ports/linux-ipv4-endpoint-peer/**', 'ports/native_session.py', '.github/workflows/linux-ipv4-endpoint-peer.yml', 'protocol_lab/**', 'model/arp-endpoint.json', 'model/arp-udp-transmit.json', 'model/ipv4-udp-icmp-endpoint.json', 'model/ipv4-udp-icmp-tap.json', 'spec/ipv4-udp-icmp-tap-oracle.json', 'spec/fixtures/ipv4_udp_icmp_tap_v1.py', 'spec/sources/**', 'docs/ipv4-udp-icmp-tap.md', 'scenarios/ipv4-udp-icmp-tap/**', 'tests/test_ipv4_udp_icmp_tap.py', 'flows/arp-udp-transmit.json', 'examples/arp_observe.py', 'examples/ethernet_udp_observe.py', 'examples/icmp_observe.py', 'protocol_lab/udp_observe.py', 'tests/test_arp_udp_transmit.py', 'requirements-formal.txt', 'tests/test_linux_ipv4_endpoint_peer.py', 'tests/test_icmp_echo_inductive.py', 'flows/icmp-echo-inductive.json']
permissions:
  contents: read
jobs:
  kernel-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 tcpdump python3-venv iputils-ping ethtool
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts
      - name: Check integrated session faults and explicit TAP model contracts
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_linux_ipv4_endpoint_peer.py -v > artifacts/linux-ipv4-endpoint-peer-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_ipv4_udp_icmp_tap.py -v > artifacts/linux-ipv4-contract-tests.log 2>&1
      - name: Check supplementary ICMP invariant induction without promoting old BMC UNKNOWN
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_icmp_echo_inductive.py -v > artifacts/icmp-inductive-tests.log 2>&1
          ICMP_TASK_SHA=$(sha256sum flows/icmp-echo-inductive.json | cut -d ' ' -f 1)
          .venv/bin/python examples/run_spec_candidate.py --workspace . --task flows/icmp-echo-inductive.json --task-sha256 "$ICMP_TASK_SHA" --out artifacts/icmp-inductive > artifacts/icmp-inductive-result.json
      - name: Run one generated C through ARP UDP echo and iputils Echo
        run: sudo .venv/bin/python ports/linux-ipv4-endpoint-peer/run.py --out artifacts/linux-ipv4-endpoint-peer
      - name: Reconstruct and verify original runtime evidence
        run: sudo .venv/bin/python ports/linux-ipv4-endpoint-peer/verify.py --out artifacts/linux-ipv4-endpoint-peer
      - name: Retain raw source-bound sessions PCAP and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-ir-ipv4-endpoint-peer-${{ github.sha }}
          path: |
            artifacts/icmp-inductive/
            artifacts/icmp-inductive-tests.log
            artifacts/icmp-inductive-result.json
            artifacts/linux-ipv4-endpoint-peer/
            artifacts/linux-ipv4-endpoint-peer-tests.log
            artifacts/linux-ipv4-contract-tests.log
          if-no-files-found: error
