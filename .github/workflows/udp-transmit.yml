name: IR IPv4 UDP transmit bytes
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'model/udp-wire-transmit*.json', 'scenarios/udp-wire-transmit/**', 'flows/udp-wire-transmit.json', 'spec/udp-wire-transmit-oracle.json', 'examples/run_udp_transmit.py', 'tests/test_udp_transmit.py', 'docs/udp-wire-transmit.md', '.github/workflows/udp-transmit.yml']
  pull_request:
    paths: ['protocol_lab/**', 'model/udp-wire-transmit*.json', 'scenarios/udp-wire-transmit/**', 'flows/udp-wire-transmit.json', 'spec/udp-wire-transmit-oracle.json', 'examples/run_udp_transmit.py', 'tests/test_udp_transmit.py', 'docs/udp-wire-transmit.md', '.github/workflows/udp-transmit.yml']
permissions:
  contents: read
jobs:
  native-packets-and-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned tools
        run: |
          python3 -m venv /tmp/udp-transmit-venv
          /tmp/udp-transmit-venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/udp-transmit-ci
      - name: Check literal packet policy and independent decoder faults
        run: /tmp/udp-transmit-venv/bin/python -m unittest discover -s tests -p test_udp_transmit.py -v > artifacts/udp-transmit-ci/tests.log 2>&1
      - name: Execute ten stages then frame actual native egress and compare
        run: |
          UDP_TX_TASK_SHA=$(sha256sum flows/udp-wire-transmit.json | cut -d ' ' -f 1)
          UDP_TX_ORACLE_SHA=$(sha256sum spec/udp-wire-transmit-oracle.json | cut -d ' ' -f 1)
          /tmp/udp-transmit-venv/bin/python examples/run_udp_transmit.py --workspace . --task flows/udp-wire-transmit.json --task-sha256 "$UDP_TX_TASK_SHA" --oracle spec/udp-wire-transmit-oracle.json --oracle-sha256 "$UDP_TX_ORACLE_SHA" --out artifacts/udp-transmit-ci/run > artifacts/udp-transmit-ci/result.json
      - name: Retain generated C ELF actual stdout raw PCAP decoder and Difference
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: udp-transmit-${{ github.sha }}
          path: artifacts/udp-transmit-ci/
          if-no-files-found: error
