name: Finite TCP raw wire reference Z3 and native C
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'model/tcp-wire-endpoint.json', 'model/tcp-data.json', 'scenarios/tcp-wire-endpoint/**', 'spec/tcp-wire-endpoint-oracle.json', 'tests/test_tcp_wire_endpoint.py', 'tests/test_tcp_exchange_transport.py', 'tests/test_tcp_wire_capture.py', 'ports/linux-tcp-wire-peer/**', '.github/workflows/tcp-wire-endpoint.yml']
  pull_request:
    paths: ['protocol_lab/**', 'model/tcp-wire-endpoint.json', 'model/tcp-data.json', 'scenarios/tcp-wire-endpoint/**', 'spec/tcp-wire-endpoint-oracle.json', 'tests/test_tcp_wire_endpoint.py', 'tests/test_tcp_exchange_transport.py', 'tests/test_tcp_wire_capture.py', 'ports/linux-tcp-wire-peer/**', '.github/workflows/tcp-wire-endpoint.yml']
permissions:
  contents: read
jobs:
  finite-wire-and-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/tcp-wire-ci
      - name: Frozen reference fixed Z3 actual C and adapter contracts
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_tcp_wire_endpoint.py -v > artifacts/tcp-wire-ci/wire-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_tcp_exchange_transport.py -v > artifacts/tcp-wire-ci/adapter-synthetic-tests.log 2>&1
          .venv/bin/python -m unittest discover -s tests -p test_tcp_wire_capture.py -v > artifacts/tcp-wire-ci/codec-synthetic-tests.log 2>&1
          .venv/bin/python examples/run_native_suite.py model/tcp-wire-endpoint.json --scenario-dir scenarios/tcp-wire-endpoint --formal-replay --out artifacts/tcp-wire-ci/native > artifacts/tcp-wire-ci/native-result.json
      - name: Preserve raw compile traces fixed SMT and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-tcp-wire-${{ github.sha }}
          path: artifacts/tcp-wire-ci/
          if-no-files-found: error
