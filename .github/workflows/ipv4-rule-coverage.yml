name: Finite IPv4 directed rule paths
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'model/ipv4-endpoint-virtual-link.json', 'scenarios/ipv4-rule-coverage/**', 'tests/test_ipv4_rule_coverage.py', '.github/workflows/ipv4-rule-coverage.yml']
  pull_request:
    paths: ['protocol_lab/**', 'model/ipv4-endpoint-virtual-link.json', 'scenarios/ipv4-rule-coverage/**', 'tests/test_ipv4_rule_coverage.py', '.github/workflows/ipv4-rule-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  default-path-native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare dependency
        run: |
          python3 -m venv /tmp/ipv4-directed-venv
          /tmp/ipv4-directed-venv/bin/python -m pip install -r requirements-formal.txt
      - name: Observe fresh generated C on frozen default-initial paths
        run: |
          mkdir -p artifacts/ipv4-directed-ci
          /tmp/ipv4-directed-venv/bin/python -m unittest discover -s tests -p test_ipv4_rule_coverage.py -v > artifacts/ipv4-directed-ci/tests.log 2>&1
      - name: Preserve actual result including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-ipv4-directed-${{ github.sha }}
          path: artifacts/ipv4-directed-ci/
          if-no-files-found: error
