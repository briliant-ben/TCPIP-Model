name: IR finite ARP endpoint
on:
  push:
    branches: ['codex/**', main]
    paths: ['protocol_lab/**', 'spec/arp-endpoint-oracle.json', 'spec/fixtures/arp_endpoint_v1.py', 'model/arp-endpoint*.json', 'scenarios/arp-endpoint/**', 'flows/arp-endpoint.json', 'tests/test_arp_endpoint.py', 'docs/arp-endpoint.md', '.github/workflows/arp-endpoint.yml']
  pull_request:
    paths: ['protocol_lab/**', 'spec/arp-endpoint-oracle.json', 'spec/fixtures/arp_endpoint_v1.py', 'model/arp-endpoint*.json', 'scenarios/arp-endpoint/**', 'flows/arp-endpoint.json', 'tests/test_arp_endpoint.py', 'docs/arp-endpoint.md', '.github/workflows/arp-endpoint.yml']
permissions:
  contents: read
jobs:
  native-packets-and-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned tools
        run: |
          python3 -m venv /tmp/arp-endpoint-venv
          /tmp/arp-endpoint-venv/bin/python -m pip install -r requirements-formal.txt
          mkdir -p artifacts/arp-endpoint-ci
      - name: Check ARP literal wire cache timer and native fault contracts
        run: /tmp/arp-endpoint-venv/bin/python -m unittest discover -s tests -p test_arp_endpoint.py -v > artifacts/arp-endpoint-ci/tests.log 2>&1
      - name: Execute and verify ten stages
        run: |
          ARP_ENDPOINT_TASK_SHA=$(sha256sum flows/arp-endpoint.json | cut -d ' ' -f 1)
          /tmp/arp-endpoint-venv/bin/python examples/run_spec_candidate.py --workspace . --task flows/arp-endpoint.json --task-sha256 "$ARP_ENDPOINT_TASK_SHA" --out artifacts/arp-endpoint-ci/run > artifacts/arp-endpoint-ci/result.json
      - name: Retain generated C ELF stdout SMT and Difference
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arp-endpoint-${{ github.sha }}
          path: artifacts/arp-endpoint-ci/
          if-no-files-found: error
  immutable-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export and hash-check the fixed arp-endpoint release
        run: |
          python3 deploy/package.py --source HEAD --profile arp-endpoint --out artifacts/arp-endpoint-release/bundle
          BYTE_RELEASE_SHA=$(python3 -c 'import json; print(json.load(open("artifacts/arp-endpoint-release/bundle/build.json"))["archive_sha256"])')
          python3 deploy/unpack.py artifacts/arp-endpoint-release/bundle/spec-flow-server.tar.gz --sha256 "$BYTE_RELEASE_SHA" --out /tmp/arp-endpoint-immutable-release
      - name: Execute 119 methods nine tasks ARP fixed Z3 and old TCP UDP regressions
        run: python3 deploy/bootstrap.py /tmp/arp-endpoint-immutable-release --out artifacts/arp-endpoint-release/run > artifacts/arp-endpoint-release/bootstrap-result.json
      - name: Retain Linux release sources hashes original executions and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arp-endpoint-release-${{ github.sha }}
          path: artifacts/arp-endpoint-release/
          if-no-files-found: error
